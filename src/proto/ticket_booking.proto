syntax = "proto3";

package ticketbooking;

service ClientService {
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc Logout(LogoutRequest) returns (StatusResponse);
  rpc Post(PostRequest) returns (StatusResponse);
  rpc Get(GetRequest) returns (GetResponse);
}

service RaftService {
  rpc RequestVote(RequestVoteArgs) returns (RequestVoteReply);
  rpc AppendEntries(AppendEntriesArgs) returns (AppendEntriesReply);
}

service LLMService {
  rpc GetLLMAnswer(LLMRequest) returns (LLMResponse);
}

message LoginRequest { string username = 1; string password = 2; }
message LoginResponse { string status = 1; string token = 2; string message = 3; }
message LogoutRequest { string token = 1; }
message StatusResponse { string status = 1; string message = 2; string redirect_to = 3; string booking_id = 4; }
message PostRequest { string token = 1; string type = 2; bytes data = 3; string request_id = 4; }
message GetRequest { string token = 1; string type = 2; bytes params = 3; }
message Item { string id = 1; bytes data = 2; }
message GetResponse { string status = 1; repeated Item items = 2; string message = 3; }

message RequestVoteArgs { string from = 1; string to = 2; int64 term = 3; int64 last_log_index = 4; int64 last_log_term = 5; }
message RequestVoteReply { string from = 1; string to = 2; int64 term = 3; bool vote_granted = 4; }
message LogEntry { int64 term = 1; int64 index = 2; string command_type = 3; bytes payload = 4; string request_id = 5; }
message AppendEntriesArgs { string from = 1; string to = 2; int64 term = 3; int64 prev_index = 4; int64 prev_term = 5; int64 commit_index = 6; repeated LogEntry entries = 7; }
message AppendEntriesReply { string from = 1; string to = 2; int64 term = 3; bool entry_appended = 4; int64 match_index = 5; }

message LLMRequest { string request_id = 1; string query = 2; string context = 3; }
message LLMResponse { string request_id = 1; string answer = 2; }
