[project]
name = "distributed-ticket-booking"
version = "0.1.0"
description = "gRPC ticket booking system with Raft consensus"
requires-python = ">=3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["ticket_booking/generated"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "SIM", "UP"]
ignore = ["E501", "UP038"]

[tool.ruff.lint.per-file-ignores]
"ui/app.py" = ["E402"]
"scripts/*.py" = ["E402"]
